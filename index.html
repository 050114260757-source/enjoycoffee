
<style>
/* =====================================
   ENJOY COFFEE - NATURAL PREMIUM
   Xanh rêu - Nâu cà phê - Kem be
===================================== */

:root {
    --coffee-dark: #354638;
    --coffee-brown: #513729;
    --coffee-caramel: #A4774F;
    --coffee-gold: #B58A58;
    --cream: #F4F0E6;
    --cream-light: #FCFAF5;
    --beige: #E5DDCE;
    --text-main: #393B32;
    --text-muted: #77766A;
}

/* Nền chung */
html {
    scroll-behavior: smooth;
    scroll-padding-top: 90px;
}

body {
    margin: 0;
    background: var(--cream-light);
    color: var(--text-main);
    font-family: "Segoe UI", Arial, sans-serif;
    line-height: 1.8;
}

/* Tiêu đề */
h1, h2, h3, h4, h5 {
    color: var(--coffee-dark);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.4;
}

h2 {
    font-weight: 700;
    letter-spacing: 0.8px;
    margin-bottom: 26px;
}

p {
    color: var(--text-main);
}

/* Header và thanh điều hướng */
header {
    background: var(--cream-light);
    border-bottom: 1px solid var(--beige);
    box-shadow: 0 4px 16px rgba(53, 70, 56, 0.07);
    position: relative;
    z-index: 100;
}

header .container {
    padding-top: 10px;
    padding-bottom: 10px;
}

header nav a,
#d-menu a {
    color: var(--coffee-dark);
    font-weight: 600;
    text-decoration: none;
    transition: color 0.25s ease;
}

header nav a:hover,
#d-menu a:hover {
    color: var(--coffee-caramel);
}

/* Menu con */
#d-menu .sub-menu {
    background: var(--cream-light);
    border: 1px solid var(--beige);
    box-shadow: 0 8px 24px rgba(53, 70, 56, 0.12);
}

#d-menu .sub-menu a {
    display: block;
    padding: 10px 16px;
}

#d-menu .sub-menu a:hover {
    background: var(--cream);
}

/* Banner trình chiếu */
#homeslider {
    background: var(--coffee-dark);
    margin-bottom: 0;
}

#homeslider img {
    display: block;
    width: 100%;
    height: auto;
}

/* Giới thiệu thương hiệu */
#introduce {
    background: var(--cream);
    padding-top: 35px;
    padding-bottom: 35px;
}

#introduce .column {
    box-sizing: border-box;
}

#introduce img {
    max-width: 100%;
    height: auto;
    border-radius: 8px;
}

#introduce h2 {
    color: var(--coffee-dark);
}

#introduce li {
    color: var(--text-muted);
    margin-bottom: 10px;
}

/* Menu đồ uống */
#menu {
    background: var(--coffee-dark);
    color: var(--cream-light);
}

#menu .menu1 {
    background: linear-gradient(
        135deg,
        #354638 0%,
        #29382D 55%,
        #513729 100%
    );
}

#menu h2,
#menu h5,
#menu .info p {
    color: var(--cream-light);
}

#menu .item {
    border-bottom: 1px solid rgba(244, 240, 230, 0.2);
    padding: 14px 0;
    transition: padding-left 0.25s ease;
}

#menu .item:hover {
    padding-left: 6px;
}

#menu .price span {
    color: #D8B681;
    font-weight: 700;
}

/* Tin tức */
#bloghome {
    background: var(--cream-light);
    padding-top: 35px;
    padding-bottom: 35px;
}

#bloghome h2,
#featuredproducts h2 {
    color: var(--coffee-dark);
}

#bloghome .item {
    background: #FFFFFF;
    border: 1px solid rgba(53, 70, 56, 0.10);
    border-radius: 9px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(53, 70, 56, 0.05);
    transition: transform 0.3s ease,
                box-shadow 0.3s ease;
}

#bloghome .item:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 24px rgba(53, 70, 56, 0.12);
}

#bloghome .info {
    padding: 18px;
}

#bloghome .info h3 a {
    color: var(--coffee-dark);
    text-decoration: none;
    transition: color 0.25s ease;
}

#bloghome .info h3 a:hover {
    color: var(--coffee-caramel);
}

#bloghome .info p {
    color: var(--text-muted);
}

#bloghome .cate {
    background: var(--coffee-dark);
    color: #FFFFFF;
    padding: 5px 12px;
    border-radius: 3px;
}

/* Sản phẩm */
#featuredproducts {
    background: var(--cream);
    padding-top: 35px;
    padding-bottom: 45px;
}

#featuredproducts .item {
    background: #FFFFFF;
    border: 1px solid var(--beige);
    border-radius: 9px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(53, 70, 56, 0.05);
    transition: transform 0.3s ease,
                box-shadow 0.3s ease;
}

#featuredproducts .item:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 24px rgba(53, 70, 56, 0.12);
}

#featuredproducts .item .img {
    display: block;
    background-color: var(--beige);
    background-position: center;
    background-size: cover;
}

#featuredproducts .item .info {
    padding: 15px;
}

#featuredproducts .item h4 a {
    color: var(--coffee-dark);
    text-decoration: none;
}

#featuredproducts .item h4 a:hover {
    color: var(--coffee-caramel);
}

#featuredproducts .item .cate a {
    color: var(--coffee-caramel);
}

#featuredproducts .item .info p {
    color: var(--coffee-brown);
    font-weight: 700;
    font-size: 18px;
}

/* Nút bấm */
.button,
a.button,
.readmore.button,
.view-all .button {
    display: inline-block;
    background: var(--coffee-dark);
    color: #FFFFFF !important;
    border: 1px solid var(--coffee-dark);
    border-radius: 4px;
    padding: 11px 22px;
    font-weight: 600;
    text-decoration: none;
    transition: background 0.25s ease,
                border-color 0.25s ease,
                transform 0.25s ease;
}

.button:hover,
a.button:hover,
.readmore.button:hover,
.view-all .button:hover {
    background: var(--coffee-caramel);
    border-color: var(--coffee-caramel);
    color: #FFFFFF !important;
    transform: translateY(-2px);
}

/* Chân trang */
footer {
    background: var(--coffee-dark);
    color: var(--cream);
    border-top: 4px solid var(--coffee-gold);
}

footer h4,
footer p {
    color: var(--cream-light);
}

footer a {
    color: #E5DDCE;
    text-decoration: none;
    transition: color 0.25s ease;
}

footer a:hover {
    color: #D8B681;
}

footer .bottom {
    border-top: 1px solid rgba(244, 240, 230, 0.2);
}

/* Ảnh và hiển thị trên điện thoại */
img {
    max-width: 100%;
}

@media (max-width: 768px) {
    body {
        font-size: 15px;
    }

    #introduce,
    #bloghome,
    #featuredproducts {
        padding-top: 25px;
        padding-bottom: 25px;
    }

    #introduce h2,
    #menu h2,
    #bloghome h2,
    #featuredproducts h2 {
        font-size: 24px;
    }

    #bloghome .item,
    #featuredproducts .item {
        margin-bottom: 18px;
    }

    .button,
    a.button {
        padding: 10px 16px;
    }
}
</style>
